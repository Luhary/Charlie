name: Companion
options:
  bundleIdPrefix: com.luhary
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Companion:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Чарли
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Нужна, чтобы искать места рядом и строить маршруты от тебя.
        LSApplicationQueriesSchemes: [yandexmaps]
        NSContactsUsageDescription: Нужно, чтобы находить контакт по имени, когда ты просишь позвонить.
        NSAlarmKitUsageDescription: Нужно, чтобы ставить будильники и таймеры по твоей просьбе.
        NSCalendarsWriteOnlyAccessUsageDescription: Нужно, чтобы записывать события в календарь по твоей просьбе.
        NSMicrophoneUsageDescription: Нужен, чтобы слышать твои команды.
        NSSpeechRecognitionUsageDescription: Распознавание речи на устройстве.
        CFBundleURLTypes:
          - CFBundleURLName: com.luhary.companion
            CFBundleURLSchemes: [companion]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luhary.companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CompanionWidget
  CompanionWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Чарли
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luhary.companion.widget
